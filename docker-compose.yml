services:
  # === WEB APPLICATIONS ===
  saucedemo-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staging-app
    ports:
      - "3000:80"
    networks:
      - qa-network

  saucedemo-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-app
    ports:
      - "3001:80"
    networks:
      - qa-network

  # === API APPLICATIONS ===
  api-staging:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: staging-api
    ports:
      - "4000:3002"
    networks:
      - qa-network

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dev-api
    ports:
      - "4001:3003"
    networks:
      - qa-network

  # === JENKINS SERVER ===
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-ci
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qa-network

networks:
  qa-network:
    name: qa-automation-network
    driver: bridge

volumes:
  jenkins_home:
